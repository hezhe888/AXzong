<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BIGO 投放柱状图（Q3）</title>
  <style>
    :root {
      --ink: #17212b;
      --muted: #617080;
      --grid: #dde5ec;
      --blue: #2f6fed;
      --green: #10a37f;
      --amber: #f2a900;
      --bg: #ffffff;
      --panel: #f5f7fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--panel);
      color: var(--ink);
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
    }
    .wrap {
      width: min(1680px, calc(100vw - 32px));
      margin: 24px auto;
      background: var(--bg);
      border: 1px solid #e5ebf2;
      border-radius: 8px;
      padding: 28px 30px 26px;
      box-shadow: 0 10px 30px rgba(23, 33, 43, 0.07);
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-start;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.15;
      letter-spacing: 0;
    }
    .sub {
      color: var(--muted);
      font-size: 16px;
      margin-top: 6px;
    }
    .kpis {
      display: grid;
      grid-template-columns: repeat(3, minmax(132px, 1fr));
      gap: 12px;
      min-width: 470px;
    }
    .kpi {
      border: 1px solid #e3eaf1;
      border-radius: 8px;
      padding: 10px 12px;
      background: #fbfcfe;
    }
    .kpi .label {
      color: var(--muted);
      font-size: 13px;
    }
    .kpi .value {
      font-size: 21px;
      font-weight: 700;
      margin-top: 4px;
      white-space: nowrap;
    }
    .chart-card {
      position: relative;
      border: 1px solid #e3eaf1;
      border-radius: 8px;
      background: #fff;
      padding: 16px 16px 10px;
    }
    svg {
      width: 100%;
      height: 760px;
      display: block;
    }
    .hover {
      cursor: crosshair;
    }
    .tooltip {
      position: absolute;
      display: none;
      pointer-events: none;
      min-width: 210px;
      padding: 11px 13px;
      border: 1px solid #d8e1eb;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 8px 24px rgba(23, 33, 43, 0.16);
      font-size: 14px;
      line-height: 1.55;
      z-index: 5;
    }
    .tooltip .date {
      font-weight: 700;
      margin-bottom: 4px;
    }
    .legend {
      display: flex;
      gap: 22px;
      margin: 12px 0 0 90px;
      color: var(--muted);
      font-size: 14px;
    }
    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .swatch {
      width: 28px;
      height: 12px;
      border-radius: 3px;
      display: inline-block;
    }
    @media (max-width: 980px) {
      header { display: block; }
      .kpis { min-width: 0; margin-top: 16px; }
      svg { height: 680px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <h1>BIGO 投放柱状图</h1>
        <div class="sub">2026 Q3（7-9月）；每日 bigo 花费与 Revenue 并列柱状图，ROI 单独放在下方趋势区；悬停查看当天明细。</div>
      </div>
      <section class="kpis">
        <div class="kpi"><div class="label">总花费</div><div id="totalSpend" class="value"></div></div>
        <div class="kpi"><div class="label">总 Revenue</div><div id="totalRevenue" class="value"></div></div>
        <div class="kpi"><div class="label">总 ROI</div><div id="totalRoi" class="value"></div></div>
      </section>
    </header>
    <section id="chartCard" class="chart-card">
      <svg id="chart" role="img" aria-label="BIGO 投放柱状图与 ROI 趋势"></svg>
      <div id="tooltip" class="tooltip"></div>
      <div class="legend">
        <span><i class="swatch" style="background: var(--blue)"></i>bigo 花费</span>
        <span><i class="swatch" style="background: var(--green)"></i>Revenue</span>
        <span><i class="swatch" style="background: var(--amber)"></i>ROI</span>
      </div>
    </section>
  </main>

    const totals = {"spend": 7445.91, "revenue": 9361.61, "roi": 1.257282};
    const svg = document.getElementById("chart");
    const card = document.getElementById("chartCard");
    const tooltip = document.getElementById("tooltip");
    const colors = {
      ink: "#17212b",
      muted: "#617080",
      grid: "#dde5ec",
      blue: "#2f6fed",
      green: "#10a37f",
      amber: "#f2a900"
    };
    function money(value) {
      return Number(value).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function shortMoney(value) {
      return Number(value).toLocaleString("en-US", { maximumFractionDigits: 0 });
    }
    function pct(value) {
      return `${(Number(value) * 100).toFixed(1)}%`;
    }
    function create(tag, attrs = {}, parent = svg) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, value);
      parent.appendChild(el);
      return el;
    }
    function showTip(event, item) {
      tooltip.style.display = "block";
      tooltip.innerHTML = `
        <div class="date">${item.date}</div>
        <div style="color:${colors.blue};font-weight:700">bigo 花费：${money(item.spend)}</div>
        <div style="color:${colors.green};font-weight:700">Revenue：${money(item.revenue)}</div>
        <div style="color:${colors.amber};font-weight:700">Revenue ROI：${pct(item.roi)}</div>
      `;
      moveTip(event);
    }
    function moveTip(event) {
      const bounds = card.getBoundingClientRect();
      const tipW = tooltip.offsetWidth;
      const tipH = tooltip.offsetHeight;
      let left = event.clientX - bounds.left + 16;
      let top = event.clientY - bounds.top - tipH - 14;
      if (left + tipW > bounds.width) left = event.clientX - bounds.left - tipW - 16;
      if (top < 0) top = event.clientY - bounds.top + 18;
      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
    }
    function hideTip() {
      tooltip.style.display = "none";
    }
    function linePath(points) {
      return points.map((p, i) => `${i === 0 ? "M" : "L"}${p.x.toFixed(2)} ${p.y.toFixed(2)}`).join(" ");
    }
    function render() {
      document.getElementById("totalSpend").textContent = money(totals.spend);
      document.getElementById("totalRevenue").textContent = money(totals.revenue);
      document.getElementById("totalRoi").textContent = pct(totals.roi);
      svg.innerHTML = "";

      const width = 2600;
      const height = 760;
      const left = 76;
      const right = 84;
      const top = 36;
      const barPlotH = 420;
      const gap = 62;
      const roiTop = top + barPlotH + gap;
      const roiPlotH = 150;
      const bottom = 72;
      const plotW = width - left - right;
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

      const maxValue = Math.ceil(Math.max(...data.flatMap(d => [d.spend, d.revenue])) / 50) * 50;
      const maxRoi = Math.max(2, Math.ceil(Math.max(...data.map(d => d.roi)) * 10) / 10);
      const groupW = plotW / data.length;
      const barW = Math.max(6, groupW * 0.32);
      const y = value => top + barPlotH - value / maxValue * barPlotH;
      const yRoi = value => roiTop + roiPlotH - value / maxRoi * roiPlotH;

      for (let i = 0; i <= 5; i++) {
        const value = maxValue * i / 5;
        const yy = y(value);
        create("line", { x1: left, y1: yy, x2: width - right, y2: yy, stroke: colors.grid, "stroke-width": 1 });
        create("text", { x: left - 12, y: yy + 5, "text-anchor": "end", fill: colors.muted, "font-size": 13 }).textContent = shortMoney(value);
      }
      create("text", { x: left, y: top - 14, fill: colors.muted, "font-size": 14, "font-weight": 700 }).textContent = "花费 / Revenue";

      for (let i = 0; i <= 4; i++) {
        const value = maxRoi * i / 4;
        const yy = yRoi(value);
        create("line", { x1: left, y1: yy, x2: width - right, y2: yy, stroke: colors.grid, "stroke-width": 1 });
        create("text", { x: left - 12, y: yy + 5, "text-anchor": "end", fill: colors.muted, "font-size": 12 }).textContent = pct(value);
      }
      create("text", { x: left, y: roiTop - 16, fill: colors.amber, "font-size": 14, "font-weight": 700 }).textContent = "Revenue ROI";

      const roiPoints = [];
      data.forEach((item, index) => {
        const cx = left + index * groupW + groupW / 2;
        const spendH = barPlotH - (y(item.spend) - top);
        const revenueH = barPlotH - (y(item.revenue) - top);
        create("rect", { x: cx - barW - 2, y: y(item.spend), width: barW, height: spendH, rx: 4, fill: colors.blue });
        create("rect", { x: cx + 2, y: y(item.revenue), width: barW, height: revenueH, rx: 4, fill: colors.green });
        const point = { x: cx, y: yRoi(item.roi), item };
        roiPoints.push(point);
        if (index % 7 === 0 || index === data.length - 1) {
          create("text", { x: cx, y: height - 34, "text-anchor": "middle", fill: colors.ink, "font-size": 13 }).textContent = item.label;
        }
        const hit = create("rect", { x: cx - groupW / 2, y: top, width: groupW, height: roiTop + roiPlotH - top, fill: "transparent", class: "hover" });
        hit.addEventListener("mouseenter", event => showTip(event, item));
        hit.addEventListener("mousemove", event => moveTip(event));
        hit.addEventListener("mouseleave", hideTip);
      });

      create("path", { d: linePath(roiPoints), fill: "none", stroke: colors.amber, "stroke-width": 3, "stroke-linejoin": "round" });
      roiPoints.forEach(p => create("circle", { cx: p.x, cy: p.y, r: 4, fill: colors.amber, stroke: "#fff", "stroke-width": 2 }));
      create("text", { x: left + plotW / 2, y: height - 8, "text-anchor": "middle", fill: colors.muted, "font-size": 14 }).textContent = "日期";
      create("text", { x: 18, y: top + barPlotH / 2, fill: colors.muted, "font-size": 14 }).textContent = "金额";
    }
    render();
