<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>日维度 Revenue & 毛利（aXhare）</title>
  <style>
    :root {
      --ink: #17212b;
      --muted: #617080;
      --grid: #dde5ec;
      --axis: #7d8a96;
      --blue: #2f6fed;
      --green: #10a37f;
      --amber: #f2a900;
      --profit: #d14c32;
      --bg: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f5f7fa;
      color: var(--ink);
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
    }
    .wrap {
      width: min(1800px, calc(100vw - 32px));
      margin: 24px auto;
      background: var(--bg);
      border: 1px solid #e5ebf2;
      border-radius: 8px;
      padding: 28px 30px 22px;
      box-shadow: 0 10px 30px rgba(23, 33, 43, 0.07);
    }
    .head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 8px;
    }
    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.15;
      letter-spacing: 0;
    }
    .sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: 16px;
    }
    .legend {
      display: flex;
      gap: 22px;
      align-items: center;
      margin-top: 10px;
      font-size: 15px;
      white-space: nowrap;
    }
    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .swatch {
      width: 28px;
      height: 12px;
      border-radius: 3px;
      display: inline-block;
    }
    .chart-box {
      position: relative;
      width: 100%;
      height: min(760px, calc(100vh - 190px));
      min-height: 560px;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }
    .tooltip {
      position: absolute;
      pointer-events: none;
      display: none;
      min-width: 190px;
      padding: 10px 12px;
      border: 1px solid #d8e1eb;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 8px 24px rgba(23, 33, 43, 0.16);
      font-size: 14px;
      line-height: 1.55;
      z-index: 5;
    }
    .tooltip .date {
      font-weight: 700;
      margin-bottom: 4px;
    }
    .tooltip .rev { color: var(--blue); font-weight: 700; }
    .tooltip .profit { color: var(--profit); font-weight: 700; }
  </style>
</head>

  <main class="wrap">
    <div class="head">
      <div>
        <h1>日维度 Revenue & 毛利（aXhare）</h1>
        <div class="sub">2026 Q3（7-9月）· aXhare 端口；鼠标悬停任意日期查看 Revenue、Payout、毛利；毛利 = Revenue - Payout</div>
      </div>
      <div class="legend">
        <span><i class="swatch" style="background: var(--blue)"></i>Revenue</span>
        <span><i class="swatch" style="background: var(--profit)"></i>毛利</span>
        <span><i class="swatch" style="background: var(--amber)"></i>首次突破节点</span>
      </div>
    </div>
    <div id="chartBox" class="chart-box">
      <svg id="chart" role="img" aria-label="日维度 Revenue 与毛利交互图"></svg>
      <div id="tooltip" class="tooltip"></div>
    </div>
  </main>

    const thresholdDates = new Set(["2026-08-07", "2026-08-13", "2026-09-01", "2026-09-15", "2026-09-23", "2026-09-30"]);
    const colors = {
      ink: "#17212b",
      muted: "#617080",
      grid: "#dde5ec",
      axis: "#7d8a96",
      blue: "#2f6fed",
      green: "#10a37f",
      amber: "#f2a900",
      profit: "#d14c32"
    };
    const svg = document.getElementById("chart");
    const box = document.getElementById("chartBox");
    const tooltip = document.getElementById("tooltip");

    function money(value) {
      return Number(value).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function shortMoney(value) {
      return Number(value).toLocaleString("en-US", { maximumFractionDigits: 0 });
    }

    function create(tag, attrs = {}, parent = svg) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, value);
      parent.appendChild(el);
      return el;
    }

    function linePath(points) {
      return points.map((p, i) => `${i === 0 ? "M" : "L"}${p.x.toFixed(2)} ${p.y.toFixed(2)}`).join(" ");
    }

    function render() {
      svg.innerHTML = "";
      const rect = box.getBoundingClientRect();
      const width = Math.max(1100, rect.width);
      const height = Math.max(560, rect.height);
      const pad = { left: 82, right: 34, top: 34, bottom: 72 };
      const chartW = width - pad.left - pad.right;
      const chartH = height - pad.top - pad.bottom;
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

      const maxRevenue = Math.max(...data.map(d => d.revenue));
      const yMax = Math.ceil(maxRevenue / 500) * 500;
      const start = new Date(data[0].date);
      const end = new Date(data[data.length - 1].date);
      const totalMs = end - start || 1;
      const x = d => pad.left + ((new Date(d.date) - start) / totalMs) * chartW;
      const y = value => pad.top + chartH - (value / yMax) * chartH;

      for (let value = 0; value <= yMax; value += yMax / 5) {
        const yy = y(value);
        create("line", { x1: pad.left, y1: yy, x2: width - pad.right, y2: yy, stroke: colors.grid, "stroke-width": 1 });
        create("text", { x: pad.left - 14, y: yy + 5, "text-anchor": "end", fill: colors.muted, "font-size": 14 })
          .textContent = shortMoney(value);
      }

      create("line", { x1: pad.left, y1: pad.top, x2: pad.left, y2: height - pad.bottom, stroke: colors.axis, "stroke-width": 1.5 });
      create("line", { x1: pad.left, y1: height - pad.bottom, x2: width - pad.right, y2: height - pad.bottom, stroke: colors.axis, "stroke-width": 1.5 });

      const revenuePoints = data.map(d => ({ ...d, x: x(d), y: y(d.revenue) }));
      const profitPoints = data.map(d => ({ ...d, x: x(d), y: y(d.profit) }));

      create("path", { d: linePath(revenuePoints), fill: "none", stroke: colors.blue, "stroke-width": 3, "stroke-linejoin": "round" });
      create("path", { d: linePath(profitPoints), fill: "none", stroke: colors.profit, "stroke-width": 3, "stroke-linejoin": "round" });

      const tickEvery = 15;
      data.forEach((d, i) => {
        if (i % tickEvery !== 0 && i !== data.length - 1) return;
        const xx = x(d);
        create("line", { x1: xx, y1: height - pad.bottom, x2: xx, y2: height - pad.bottom + 7, stroke: colors.axis });
        create("text", { x: xx, y: height - pad.bottom + 28, "text-anchor": "middle", fill: colors.ink, "font-size": 14 })
          .textContent = d.label;
      });

      create("text", { x: 24, y: pad.top + chartH / 2, fill: colors.muted, "font-size": 15 }).textContent = "金额";
      create("text", { x: pad.left + chartW / 2, y: height - 20, "text-anchor": "middle", fill: colors.muted, "font-size": 15 }).textContent = "日期";

      revenuePoints.forEach(p => {
        create("circle", { cx: p.x, cy: p.y, r: thresholdDates.has(p.date) ? 6 : 3, fill: thresholdDates.has(p.date) ? colors.amber : colors.green, stroke: "#fff", "stroke-width": thresholdDates.has(p.date) ? 2 : 0 });
      });
      profitPoints.forEach(p => {
        create("circle", { cx: p.x, cy: p.y, r: 2.4, fill: colors.profit });
      });

      const occupiedLabels = [];
      const overlaps = (a, b) => !(a.x + a.w < b.x || b.x + b.w < a.x || a.y + a.h < b.y || b.y + b.h < a.y);
      const thresholdPoints = revenuePoints.filter(p => thresholdDates.has(p.date));
      thresholdPoints.forEach(p => {
        const line1 = `${p.label}  Rev ${shortMoney(p.revenue)}`;
        const line2 = `毛利 ${shortMoney(p.profit)}`;
        const labelW = Math.max(118, Math.max(line1.length, line2.length) * 8 + 18);
        const labelH = 42;
        const candidates = [
          { dx: -labelW - 14, dy: -52 },
          { dx: 14, dy: -52 },
          { dx: -labelW - 14, dy: 18 },
          { dx: 14, dy: 18 },
          { dx: -labelW / 2, dy: -72 },
          { dx: -labelW / 2, dy: 36 }
        ];
        let box = null;
        for (const candidate of candidates) {
          const x0 = Math.max(pad.left, Math.min(width - pad.right - labelW, p.x + candidate.dx));
          const y0 = Math.max(pad.top + 6, Math.min(height - pad.bottom - labelH - 8, p.y + candidate.dy));
          const proposed = { x: x0, y: y0, w: labelW, h: labelH };
          if (!occupiedLabels.some(existing => overlaps(proposed, existing))) {
            box = proposed;
            break;
          }
        }
        if (!box) {
          box = {
            x: Math.max(pad.left, Math.min(width - pad.right - labelW, p.x - labelW / 2)),
            y: Math.max(pad.top + 6, Math.min(height - pad.bottom - labelH - 8, p.y - 58)),
            w: labelW,
            h: labelH
          };
        }
        occupiedLabels.push(box);
        const anchorX = Math.max(box.x, Math.min(box.x + box.w, p.x));
        const anchorY = p.y > box.y + box.h ? box.y + box.h : box.y;
        create("line", { x1: p.x, y1: p.y, x2: anchorX, y2: anchorY, stroke: colors.amber, "stroke-width": 1 });
        create("rect", { x: box.x, y: box.y, width: box.w, height: box.h, rx: 6, fill: "#fff", stroke: colors.grid, "stroke-width": 1 });
        create("text", { x: box.x + 9, y: box.y + 17, fill: colors.ink, "font-size": 13, "font-weight": 700 }).textContent = line1;
        create("text", { x: box.x + 9, y: box.y + 34, fill: colors.profit, "font-size": 13, "font-weight": 700 }).textContent = line2;
      });

      revenuePoints.forEach((p, i) => {
        const hitW = Math.max(10, chartW / data.length);
        const hit = create("rect", {
          x: p.x - hitW / 2,
          y: pad.top,
          width: hitW,
          height: chartH,
          fill: "transparent",
          style: "cursor: crosshair"
        });
        hit.addEventListener("mouseenter", () => showTip(p));
        hit.addEventListener("mousemove", event => moveTip(event, p));
        hit.addEventListener("mouseleave", hideTip);
      });

      let guide = null;
      function showGuide(p) {
        if (guide) guide.remove();
        guide = create("line", { x1: p.x, y1: pad.top, x2: p.x, y2: height - pad.bottom, stroke: colors.axis, "stroke-width": 1, "stroke-dasharray": "4 4", opacity: 0.8 });
      }

      function showTip(p) {
        showGuide(p);
        tooltip.style.display = "block";
        tooltip.innerHTML = `
          <div class="date">${p.date}</div>
          <div class="rev">Revenue：${money(p.revenue)}</div>
          <div>Payout：${money(p.payout)}</div>
          <div class="profit">毛利：${money(p.profit)}</div>
        `;
      }

      function moveTip(event, p) {
        showTip(p);
        const bounds = box.getBoundingClientRect();
        const tipW = tooltip.offsetWidth;
        const tipH = tooltip.offsetHeight;
        let left = event.clientX - bounds.left + 16;
        let top = event.clientY - bounds.top - tipH - 14;
        if (left + tipW > bounds.width) left = event.clientX - bounds.left - tipW - 16;
        if (top < 0) top = event.clientY - bounds.top + 18;
        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
      }

      function hideTip() {
        tooltip.style.display = "none";
        if (guide) {
          guide.remove();
          guide = null;
        }
      }
    }

    render();
    window.addEventListener("resize", render);
  </script>
</body>
</html>
