<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pub Revenue 饼图 & 毛利（Q3）</title>
  <style>
    :root {
      --ink: #17212b;
      --muted: #617080;
      --grid: #dde5ec;
      --blue: #2f6fed;
      --profit: #d14c32;
      --bg: #ffffff;
      --panel: #f5f7fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--panel);
      color: var(--ink);
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
    }
    .wrap {
      width: min(1740px, calc(100vw - 32px));
      margin: 24px auto;
      background: var(--bg);
      border: 1px solid #e5ebf2;
      border-radius: 8px;
      padding: 28px 30px 26px;
      box-shadow: 0 10px 30px rgba(23, 33, 43, 0.07);
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-start;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.15;
      letter-spacing: 0;
    }
    .sub {
      color: var(--muted);
      font-size: 16px;
      margin-top: 6px;
    }
    .kpis {
      display: grid;
      grid-template-columns: repeat(3, minmax(132px, 1fr));
      gap: 12px;
      min-width: 470px;
    }
    .kpi {
      border: 1px solid #e3eaf1;
      border-radius: 8px;
      padding: 10px 12px;
      background: #fbfcfe;
    }
    .kpi .label {
      color: var(--muted);
      font-size: 13px;
    }
    .kpi .value {
      font-size: 21px;
      font-weight: 700;
      margin-top: 4px;
      white-space: nowrap;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(680px, 1.15fr) minmax(480px, 0.85fr);
      gap: 26px;
      align-items: stretch;
    }
    .chart-card {
      position: relative;
      min-height: 720px;
      border: 1px solid #e3eaf1;
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }
    svg {
      width: 100%;
      height: 100%;
      min-height: 720px;
      display: block;
    }
    .slice {
      cursor: pointer;
      transition: opacity 140ms ease, transform 140ms ease;
      transform-box: fill-box;
      transform-origin: center;
    }
    .slice:hover, .slice.active {
      opacity: 0.86;
      transform: scale(1.012);
    }
    .tooltip {
      position: absolute;
      display: none;
      pointer-events: none;
      min-width: 230px;
      padding: 11px 13px;
      border: 1px solid #d8e1eb;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 8px 24px rgba(23, 33, 43, 0.16);
      font-size: 14px;
      line-height: 1.55;
      z-index: 5;
    }
    .tooltip .name {
      font-weight: 700;
      margin-bottom: 4px;
    }
    .tooltip .rev { color: var(--blue); font-weight: 700; }
    .tooltip .profit { color: var(--profit); font-weight: 700; }
    .side {
      min-height: 720px;
      border: 1px solid #e3eaf1;
      border-radius: 8px;
      background: #fff;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }
    .selected {
      padding: 18px 18px 16px;
      border-bottom: 1px solid #e3eaf1;
      background: #fbfcfe;
    }
    .selected h2 {
      margin: 0 0 10px;
      font-size: 20px;
      letter-spacing: 0;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .metric {
      border: 1px solid #e3eaf1;
      border-radius: 8px;
      padding: 9px 10px;
      background: #fff;
    }
    .metric .label {
      color: var(--muted);
      font-size: 12px;
    }
    .metric .value {
      font-weight: 700;
      margin-top: 3px;
      white-space: nowrap;
    }
    .table-wrap {
      overflow: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #edf2f6;
      text-align: right;
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 0;
      background: #fff;
      color: var(--muted);
      font-weight: 700;
      z-index: 1;
    }
    th:first-child, td:first-child {
      text-align: left;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    tr {
      cursor: pointer;
    }
    tbody tr:hover, tbody tr.active {
      background: #f5f8fc;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
      vertical-align: middle;
    }
    @media (max-width: 1100px) {
      header { display: block; }
      .kpis { min-width: 0; margin-top: 16px; }
      .layout { grid-template-columns: 1fr; }
      .chart-card, .side { min-height: 620px; }
      svg { min-height: 620px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <h1>Pub Revenue 饼图 & 毛利</h1>
        <div class="sub">2026 Q3（7-9月）；饼图按 Revenue 占比绘制；悬停或点击切片查看 Revenue、Payout、毛利和毛利率</div>
      </div>
      <section class="kpis">
        <div class="kpi"><div class="label">Total Revenue</div><div id="totalRevenue" class="value"></div></div>
        <div class="kpi"><div class="label">Total 毛利</div><div id="totalProfit" class="value"></div></div>
        <div class="kpi"><div class="label">毛利率</div><div id="totalMargin" class="value"></div></div>
      </section>
    </header>
    <section class="layout">
      <div id="chartCard" class="chart-card">
        <svg id="pie" role="img" aria-label="Pub Revenue 交互饼图"></svg>
        <div id="tooltip" class="tooltip"></div>
      </div>
      <aside class="side">
        <div class="selected">
          <h2 id="selectedName">全部 Pub</h2>
          <div class="metrics">
            <div class="metric"><div class="label">Revenue</div><div id="selectedRevenue" class="value"></div></div>
            <div class="metric"><div class="label">占比</div><div id="selectedShare" class="value"></div></div>
            <div class="metric"><div class="label">毛利</div><div id="selectedProfit" class="value"></div></div>
            <div class="metric"><div class="label">毛利率</div><div id="selectedMargin" class="value"></div></div>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Pub</th><th>Revenue</th><th>毛利</th><th>毛利率</th><th>占比</th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </aside>
    </section>
  </main>
  <script>
    const data = [{"pub": "Leapmob合计", "revenue": 37150.64, "payout": 26854.68, "profit": 10295.96, "share": 0.152865, "margin": 0.277141}, {"pub": "mejoy合计", "revenue": 28380.58, "payout": 20675.059999999998, "profit": 7705.52, "share": 0.116779, "margin": 0.271507}, {"pub": "130113-imx bidding", "revenue": 19901.79, "payout": 14779.12, "profit": 5122.67, "share": 0.081891, "margin": 0.257397}, {"pub": "130115-bytemobi", "revenue": 19818.85, "payout": 14503.57, "profit": 5315.28, "share": 0.081549, "margin": 0.268193}, {"pub": "130118-yomiads", "revenue": 18093.07, "payout": 13300.01, "profit": 4793.06, "share": 0.074448, "margin": 0.264911}, {"pub": "hopemobi合计", "revenue": 15896.88, "payout": 11979.650000000001, "profit": 3917.23, "share": 0.065412, "margin": 0.246415}, {"pub": "130134-goodjoyads", "revenue": 12939.51, "payout": 9331.6, "profit": 3607.91, "share": 0.053243, "margin": 0.278829}, {"pub": "130128-skyworker", "revenue": 10953.75, "payout": 8006.23, "profit": 2947.52, "share": 0.045072, "margin": 0.269088}, {"pub": "130103-acshare", "revenue": 9961.23, "payout": 7368.67, "profit": 2592.56, "share": 0.040988, "margin": 0.260265}, {"pub": "130142-aXhare", "revenue": 9445.9, "payout": 9110.01, "profit": 335.89, "share": 0.038867, "margin": 0.035559}, {"pub": "jk", "revenue": 9365.05, "payout": 8477.96, "profit": 887.09, "share": 0.038535, "margin": 0.094723}, {"pub": "130121-Pando", "revenue": 7940.94, "payout": 5944.67, "profit": 1996.27, "share": 0.032675, "margin": 0.25139}, {"pub": "137103-altosum", "revenue": 7814.2, "payout": 6196.21, "profit": 1617.99, "share": 0.032153, "margin": 0.207058}, {"pub": "130120-LunaLabs", "revenue": 6805.07, "payout": 5059.9, "profit": 1745.17, "share": 0.028001, "margin": 0.256451}, {"pub": "130124-cloudmedia手动", "revenue": 5846.01, "payout": 4262.61, "profit": 1583.4, "share": 0.024055, "margin": 0.270851}, {"pub": "130108-Mobhuge", "revenue": 5707.62, "payout": 4211.99, "profit": 1495.63, "share": 0.023485, "margin": 0.262041}, {"pub": "130122-Orchidvalley", "revenue": 4876.13, "payout": 3523.15, "profit": 1352.98, "share": 0.020064, "margin": 0.27747}, {"pub": "130123-Boostcode", "revenue": 4550.42, "payout": 3264.06, "profit": 1286.36, "share": 0.018724, "margin": 0.28269}, {"pub": "130110-myfungo手动", "revenue": 2552.64, "payout": 1870.18, "profit": 682.46, "share": 0.010503, "margin": 0.267355}, {"pub": "130117-ykuaAI", "revenue": 2351.84, "payout": 1725.68, "profit": 626.16, "share": 0.009677, "margin": 0.266243}, {"pub": "137106-winwin", "revenue": 1236.51, "payout": 937.29, "profit": 299.22, "share": 0.005088, "margin": 0.241988}, {"pub": "130141-synjoy", "revenue": 502.54, "payout": 379.98, "profit": 122.56, "share": 0.002068, "margin": 0.243881}, {"pub": "137101-doubleint", "revenue": 448.46, "payout": 408.62, "profit": 39.84, "share": 0.001845, "margin": 0.088837}, {"pub": "130140-yunying", "revenue": 319.41, "payout": 285.09, "profit": 34.32, "share": 0.001314, "margin": 0.107448}, {"pub": "130143-FarmingFamily", "revenue": 105.19, "payout": 84.72, "profit": 20.47, "share": 0.000433, "margin": 0.1946}, {"pub": "130125-FurthermoreAds-lynn", "revenue": 64.48, "payout": 47.13, "profit": 17.35, "share": 0.000265, "margin": 0.269076}, {"pub": "130148-Joy Leap", "revenue": 0.07, "payout": 0.14, "profit": -0.07, "share": 0.0, "margin": -1.0}];
    const totals = {"revenue": 243028.78, "payout": 182587.98, "profit": 60440.8, "margin": 0.248698};
    const palette = [
      "#2f6fed", "#10a37f", "#f2a900", "#d14c32", "#6f58d9", "#00a6a6",
      "#8b6f47", "#e06f2f", "#496a81", "#c0447d", "#6a994e", "#7b8fa1",
      "#a65fbe", "#cf8f2e", "#2d9cdb", "#607d3b", "#b55252", "#4b65aa",
      "#8d7bd3", "#7a8b2e", "#ba6a8f", "#607080"
    ];
    const svg = document.getElementById("pie");
    const card = document.getElementById("chartCard");
    const tooltip = document.getElementById("tooltip");
    const rows = document.getElementById("rows");
    let activePub = null;

    function money(value) {
      return Number(value).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function shortMoney(value) {
      return Number(value).toLocaleString("en-US", { maximumFractionDigits: 0 });
    }
    function pct(value) {
      return `${(Number(value) * 100).toFixed(1)}%`;
    }
    function create(tag, attrs = {}, parent = svg) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, value);
      parent.appendChild(el);
      return el;
    }
    function polar(cx, cy, radius, angle) {
      return {
        x: cx + radius * Math.cos(angle),
        y: cy + radius * Math.sin(angle)
      };
    }
    function arcPath(cx, cy, outerR, innerR, start, end) {
      const large = end - start > Math.PI ? 1 : 0;
      const p1 = polar(cx, cy, outerR, start);
      const p2 = polar(cx, cy, outerR, end);
      const p3 = polar(cx, cy, innerR, end);
      const p4 = polar(cx, cy, innerR, start);
      return [
        `M ${p1.x} ${p1.y}`,
        `A ${outerR} ${outerR} 0 ${large} 1 ${p2.x} ${p2.y}`,
        `L ${p3.x} ${p3.y}`,
        `A ${innerR} ${innerR} 0 ${large} 0 ${p4.x} ${p4.y}`,
        "Z"
      ].join(" ");
    }
    function setTotals() {
      document.getElementById("totalRevenue").textContent = money(totals.revenue);
      document.getElementById("totalProfit").textContent = money(totals.profit);
      document.getElementById("totalMargin").textContent = pct(totals.margin);
    }
    function setSelected(item) {
      activePub = item?.pub || null;
      document.getElementById("selectedName").textContent = item ? item.pub : "全部 Pub";
      document.getElementById("selectedRevenue").textContent = item ? money(item.revenue) : money(totals.revenue);
      document.getElementById("selectedShare").textContent = item ? pct(item.share) : "100.0%";
      document.getElementById("selectedProfit").textContent = item ? money(item.profit) : money(totals.profit);
      document.getElementById("selectedMargin").textContent = item ? pct(item.margin) : pct(totals.margin);
      document.querySelectorAll(".slice").forEach(el => el.classList.toggle("active", el.dataset.pub === activePub));
      document.querySelectorAll("tbody tr").forEach(el => el.classList.toggle("active", el.dataset.pub === activePub));
    }
    function showTip(event, item) {
      tooltip.style.display = "block";
      tooltip.innerHTML = `
        <div class="name">${item.pub}</div>
        <div class="rev">Revenue：${money(item.revenue)}（${pct(item.share)}）</div>
        <div>Payout：${money(item.payout)}</div>
        <div class="profit">毛利：${money(item.profit)}（毛利率 ${pct(item.margin)}）</div>
      `;
      moveTip(event);
    }
    function moveTip(event) {
      const bounds = card.getBoundingClientRect();
      const tipW = tooltip.offsetWidth;
      const tipH = tooltip.offsetHeight;
      let left = event.clientX - bounds.left + 16;
      let top = event.clientY - bounds.top - tipH - 14;
      if (left + tipW > bounds.width) left = event.clientX - bounds.left - tipW - 16;
      if (top < 0) top = event.clientY - bounds.top + 18;
      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
    }
    function hideTip() {
      tooltip.style.display = "none";
    }
    function renderRows() {
      rows.innerHTML = "";
      data.forEach((item, index) => {
        const tr = document.createElement("tr");
        tr.dataset.pub = item.pub;
        tr.innerHTML = `
          <td title="${item.pub}"><span class="dot" style="background:${palette[index % palette.length]}"></span>${item.pub}</td>
          <td>${shortMoney(item.revenue)}</td>
          <td>${shortMoney(item.profit)}</td>
          <td>${pct(item.margin)}</td>
          <td>${pct(item.share)}</td>
        `;
        tr.addEventListener("mouseenter", () => setSelected(item));
        tr.addEventListener("click", () => setSelected(item));
        rows.appendChild(tr);
      });
    }
    function renderPie() {
      svg.innerHTML = "";
      const rect = card.getBoundingClientRect();
      const width = Math.max(680, rect.width);
      const height = Math.max(640, rect.height);
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      const cx = width / 2;
      const cy = height / 2 + 8;
      const outerR = Math.min(width, height) * 0.38;
      const innerR = outerR * 0.55;
      let angle = -Math.PI / 2;
      const totalRevenue = totals.revenue;

      data.forEach((item, index) => {
        const sliceAngle = (item.revenue / totalRevenue) * Math.PI * 2;
        const start = angle;
        const end = angle + sliceAngle;
        const path = create("path", {
          d: arcPath(cx, cy, outerR, innerR, start, end),
          fill: palette[index % palette.length],
          stroke: "#ffffff",
          "stroke-width": 2,
          class: "slice",
          "data-pub": item.pub
        });
        path.addEventListener("mouseenter", event => {
          setSelected(item);
          showTip(event, item);
        });
        path.addEventListener("mousemove", event => moveTip(event));
        path.addEventListener("mouseleave", hideTip);
        path.addEventListener("click", () => setSelected(item));

        if (item.share >= 0.035) {
          const mid = start + sliceAngle / 2;
          const labelPoint = polar(cx, cy, outerR + 24, mid);
          create("text", {
            x: labelPoint.x,
            y: labelPoint.y,
            "text-anchor": labelPoint.x >= cx ? "start" : "end",
            fill: "#17212b",
            "font-size": 13,
            "font-weight": 700
          }).textContent = `${item.pub.replace(/^\d+-?/, "")} ${pct(item.share)}`;
        }
        angle = end;
      });

      create("circle", { cx, cy, r: innerR - 4, fill: "#ffffff" });
      create("text", { x: cx, y: cy - 18, "text-anchor": "middle", fill: "#617080", "font-size": 16 }).textContent = "Total Revenue";
      create("text", { x: cx, y: cy + 10, "text-anchor": "middle", fill: "#17212b", "font-size": 28, "font-weight": 800 }).textContent = shortMoney(totals.revenue);
      create("text", { x: cx, y: cy + 38, "text-anchor": "middle", fill: "#d14c32", "font-size": 16, "font-weight": 700 }).textContent = `毛利 ${shortMoney(totals.profit)}`;
    }

    setTotals();
    setSelected(null);
    renderRows();
    renderPie();
    window.addEventListener("resize", renderPie);
  </script>
</body>
</html>
