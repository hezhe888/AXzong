<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pub Revenue 饼图 & 毛利</title>
  <style>
    :root {
      --ink: #17212b;
      --muted: #617080;
      --grid: #dde5ec;
      --blue: #2f6fed;
      --profit: #d14c32;
      --bg: #ffffff;
      --panel: #f5f7fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--panel);
      color: var(--ink);
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
    }
    .wrap {
      width: min(1740px, calc(100vw - 32px));
      margin: 24px auto;
      background: var(--bg);
      border: 1px solid #e5ebf2;
      border-radius: 8px;
      padding: 28px 30px 26px;
      box-shadow: 0 10px 30px rgba(23, 33, 43, 0.07);
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-start;
      margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: 34px; line-height: 1.15; letter-spacing: 0; }
    .sub { color: var(--muted); font-size: 16px; margin-top: 6px; }
    .kpis {
      display: grid;
      grid-template-columns: repeat(3, minmax(132px, 1fr));
      gap: 12px; min-width: 470px;
    }
    .kpi { border: 1px solid #e3eaf1; border-radius: 8px; padding: 10px 12px; background: #fbfcfe; }
    .kpi .label { color: var(--muted); font-size: 13px; }
    .kpi .value { font-size: 21px; font-weight: 700; margin-top: 4px; white-space: nowrap; }
    .layout {
      display: grid;
      grid-template-columns: minmax(680px, 1.15fr) minmax(480px, 0.85fr);
      gap: 26px; align-items: stretch;
    }
    .chart-card {
      position: relative; min-height: 720px;
      border: 1px solid #e3eaf1; border-radius: 8px; background: #fff; overflow: hidden;
    }
    svg { width: 100%; height: 100%; min-height: 720px; display: block; }
    .slice {
      cursor: pointer; transition: opacity 140ms ease, transform 140ms ease;
      transform-box: fill-box; transform-origin: center;
    }
    .slice:hover, .slice.active { opacity: 0.86; transform: scale(1.012); }
    .tooltip {
      position: absolute; display: none; pointer-events: none; min-width: 230px;
      padding: 11px 13px; border: 1px solid #d8e1eb; border-radius: 8px;
      background: rgba(255,255,255,0.98); box-shadow: 0 8px 24px rgba(23,33,43,0.16);
      font-size: 14px; line-height: 1.55; z-index: 5;
    }
    .tooltip .name { font-weight: 700; margin-bottom: 4px; }
    .tooltip .rev { color: var(--blue); font-weight: 700; }
    .tooltip .profit { color: var(--profit); font-weight: 700; }
    .side {
      min-height: 720px; border: 1px solid #e3eaf1; border-radius: 8px;
      background: #fff; display: grid; grid-template-rows: auto 1fr; overflow: hidden;
    }
    .selected {
      padding: 18px 18px 16px; border-bottom: 1px solid #e3eaf1; background: #fbfcfe;
    }
    .selected h2 { margin: 0 0 10px; font-size: 20px; letter-spacing: 0; }
    .metrics { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .metric { border: 1px solid #e3eaf1; border-radius: 8px; padding: 9px 10px; background: #fff; }
    .metric .label { color: var(--muted); font-size: 12px; }
    .metric .value { font-weight: 700; margin-top: 3px; white-space: nowrap; }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #edf2f6; text-align: right; white-space: nowrap; }
    th { position: sticky; top: 0; background: #fff; color: var(--muted); font-weight: 700; z-index: 1; }
    th:first-child, td:first-child { text-align: left; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
    tr { cursor: pointer; }
    tbody tr:hover, tbody tr.active { background: #f5f8fc; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; vertical-align: middle; }
    @media (max-width: 1100px) {
      header { display: block; } .kpis { min-width: 0; margin-top: 16px; }
      .layout { grid-template-columns: 1fr; } .chart-card, .side { min-height: 620px; } svg { min-height: 620px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <h1>Pub Revenue 饼图 & 毛利</h1>
        <div class="sub">9月1日-30日汇总；饼图按 Revenue 占比绘制；悬停或点击切片查看 Revenue / 毛利 / 毛利率</div>
      </div>
      <section class="kpis">
        <div class="kpi"><div class="label">Total Revenue</div><div id="totalRevenue" class="value"></div></div>
        <div class="kpi"><div class="label">Total 毛利</div><div id="totalProfit" class="value"></div></div>
        <div class="kpi"><div class="label">毛利率</div><div id="totalMargin" class="value"></div></div>
      </section>
    </header>
    <section class="layout">
      <div id="chartCard" class="chart-card">
        <svg id="pie" role="img" aria-label="Pub Revenue 交互饼图"></svg>
        <div id="tooltip" class="tooltip"></div>
      </div>
      <aside class="side">
        <div class="selected">
          <h2 id="selectedName">全部 Pub</h2>
          <div class="metrics">
            <div class="metric"><div class="label">Revenue</div><div id="selectedRevenue" class="value"></div></div>
            <div class="metric"><div class="label">占比</div><div id="selectedShare" class="value"></div></div>
            <div class="metric"><div class="label">毛利</div><div id="selectedProfit" class="value"></div></div>
            <div class="metric"><div class="label">毛利率</div><div id="selectedMargin" class="value"></div></div>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Pub</th><th>Revenue</th><th>毛利</th><th>占比</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </aside>
    </section>
  </main>
  <script>
    const raw = [
      {pub:"130111-mejoy", revenue:11410.08, margin:27.484},
      {pub:"130134-goodjoyads", revenue:11325.18, margin:28.805},
      {pub:"130118-yomiads", revenue:9775.89, margin:26.175},
      {pub:"130142-aXhare", revenue:6645.15, margin:3.893},
      {pub:"130145-Leapmob-2", revenue:6512.62, margin:28.379},
      {pub:"130101-Leapmob", revenue:5917.97, margin:26.995},
      {pub:"130121-Pando", revenue:5281.11, margin:25.287},
      {pub:"130104-hopemobi", revenue:4492.21, margin:25.580},
      {pub:"130128-skyworker", revenue:4429.65, margin:26.218},
      {pub:"130113-imx bidding", revenue:4113.63, margin:24.441},
      {pub:"130108-Mobhuge", revenue:2504.23, margin:27.226},
      {pub:"130103-acshare", revenue:2493.06, margin:24.659},
      {pub:"130124-cloudmedia", revenue:2023.20, margin:26.064},
      {pub:"130120-LunaLabs", revenue:1800.77, margin:26.903},
      {pub:"130153-skyworker3-A", revenue:1703.97, margin:30.302},
      {pub:"130122-Orchidvalley", revenue:1602.02, margin:30.844},
      {pub:"130123-Boostcode", revenue:1499.63, margin:28.817},
      {pub:"130115-bytemobi", revenue:1399.17, margin:25.779},
      {pub:"130139-imx bidding2", revenue:1279.17, margin:24.786},
      {pub:"130135-jk-328255", revenue:880.24, margin:13.383},
      {pub:"130110-myfungo", revenue:695.85, margin:25.596},
      {pub:"130141-synjoy", revenue:434.36, margin:23.029},
      {pub:"130138-jk-TK", revenue:409.26, margin:5.251},
      {pub:"130152-skyworker2-F", revenue:341.82, margin:27.298},
      {pub:"130136-myfungo2手动", revenue:150.14, margin:20.274},
      {pub:"130131-jk-325006", revenue:128.87, margin:7.302},
      {pub:"130129-jk-321023", revenue:50.73, margin:19.081},
      {pub:"130140-yunying", revenue:29.54, margin:5.755},
      {pub:"130125-FurthermoreAds", revenue:25.12, margin:30.732},
      {pub:"130143-FarmingFamily", revenue:13.94, margin:17.647},
      {pub:"130132-jk-325031", revenue:4.21, margin:5.463},
      {pub:"130126-jk-301438", revenue:0.00, margin:0.000},
      {pub:"130130-jk-323470", revenue:0.00, margin:0.000},
      {pub:"130149-jk-apkpure", revenue:0.00, margin:0.000},
      {pub:"130148-Joy Leap", revenue:0.00, margin:0.000},
      {pub:"130127-jk-321020", revenue:0.00, margin:0.000}
    ];

    const totalRevenue = raw.reduce((s,d) => s + d.revenue, 0);
    const data = raw.map(d => {
      const profit = d.revenue * d.margin / 100;
      const share = d.revenue / totalRevenue;
      return { ...d, profit, share };
    });
    const totals = {
      revenue: totalRevenue,
      profit: data.reduce((s,d) => s + d.profit, 0),
      margin: data.reduce((s,d) => s + d.profit, 0) / totalRevenue
    };

    const palette = [
      "#2f6fed","#10a37f","#f2a900","#d14c32","#6f58d9","#00a6a6",
      "#8b6f47","#e06f2f","#496a81","#c0447d","#6a994e","#7b8fa1",
      "#a65fbe","#cf8f2e","#2d9cdb","#607d3b","#b55252","#4b65aa",
      "#8d7bd3","#7a8b2e","#ba6a8f","#607080","#3b82f6","#ef4444",
      "#84cc16","#f59e0b","#8b5cf6","#14b8a6","#f43f5e","#eab308"
    ];

    const svg = document.getElementById("pie");
    const card = document.getElementById("chartCard");
    const tooltip = document.getElementById("tooltip");
    const rowsEl = document.getElementById("rows");
    let activeAdv = null;

    function money(v) { return Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
    function short(v) { return Number(v).toLocaleString("en-US",{maximumFractionDigits:0}); }
    function pctN(v)  { return (Number(v)*100).toFixed(1)+"%"; }
    function create(tag, attrs, parent) {
      parent = parent || svg;
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      parent.appendChild(el);
      return el;
    }
    function polar(cx, cy, r, a) { return { x: cx + r*Math.cos(a), y: cy + r*Math.sin(a) }; }
    function arcPath(cx, cy, outerR, innerR, start, end) {
      const large = end - start > Math.PI ? 1 : 0;
      const p1 = polar(cx, cy, outerR, start), p2 = polar(cx, cy, outerR, end);
      const p3 = polar(cx, cy, innerR, end), p4 = polar(cx, cy, innerR, start);
      return `M ${p1.x} ${p1.y} A ${outerR} ${outerR} 0 ${large} 1 ${p2.x} ${p2.y} L ${p3.x} ${p3.y} A ${innerR} ${innerR} 0 ${large} 0 ${p4.x} ${p4.y} Z`;
    }
    function setTotals() {
      document.getElementById("totalRevenue").textContent = money(totals.revenue);
      document.getElementById("totalProfit").textContent = money(totals.profit);
      document.getElementById("totalMargin").textContent = pctN(totals.margin);
    }
    function setSelected(item) {
      activeAdv = item ? item.pub : null;
      document.getElementById("selectedName").textContent = item ? item.pub : "全部 Pub";
      document.getElementById("selectedRevenue").textContent = item ? money(item.revenue) : money(totals.revenue);
      document.getElementById("selectedShare").textContent = item ? pctN(item.share) : "100.0%";
      document.getElementById("selectedProfit").textContent = item ? money(item.profit) : money(totals.profit);
      document.getElementById("selectedMargin").textContent = item ? pctN(item.margin/100) : pctN(totals.margin);
      document.querySelectorAll(".slice").forEach(el => el.classList.toggle("active", el.dataset.pub === activeAdv));
      document.querySelectorAll("tbody tr").forEach(el => el.classList.toggle("active", el.dataset.pub === activeAdv));
    }
    function showTip(event, item) {
      tooltip.style.display = "block";
      tooltip.innerHTML = `<div class="name">${item.pub}</div><div class="rev">Revenue：${money(item.revenue)}（${pctN(item.share)}）</div><div class="profit">毛利：${money(item.profit)}（毛利率 ${pctN(item.margin/100)}）</div>`;
      moveTip(event);
    }
    function moveTip(event) {
      const bounds = card.getBoundingClientRect();
      const tipW = tooltip.offsetWidth, tipH = tooltip.offsetHeight;
      let left = event.clientX - bounds.left + 16;
      let top  = event.clientY - bounds.top - tipH - 14;
      if (left + tipW > bounds.width) left = event.clientX - bounds.left - tipW - 16;
      if (top < 0) top = event.clientY - bounds.top + 18;
      tooltip.style.left = left+"px"; tooltip.style.top = top+"px";
    }
    function hideTip() { tooltip.style.display = "none"; }
    function renderRows() {
      rowsEl.innerHTML = "";
      data.forEach((item, i) => {
        const tr = document.createElement("tr");
        tr.dataset.pub = item.pub;
        tr.innerHTML = `<td title="${item.pub}"><span class="dot" style="background:${palette[i%palette.length]}"></span>${item.pub}</td><td>${short(item.revenue)}</td><td>${short(item.profit)}</td><td>${pctN(item.share)}</td>`;
        tr.addEventListener("mouseenter", () => setSelected(item));
        tr.addEventListener("click", () => setSelected(item));
        rowsEl.appendChild(tr);
      });
    }
    function renderPie() {
      svg.innerHTML = "";
      const rect = card.getBoundingClientRect();
      const width = Math.max(680, rect.width);
      const height = Math.max(640, rect.height);
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      const cx = width/2, cy = height/2 + 8;
      const outerR = Math.min(width, height)*0.38;
      const innerR = outerR*0.55;
      let angle = -Math.PI/2;

      data.forEach((item, i) => {
        const sliceAngle = (item.revenue / totals.revenue) * Math.PI*2;
        const start = angle, end = angle + sliceAngle;
        const path = create("path", {
          d: arcPath(cx, cy, outerR, innerR, start, end),
          fill: palette[i%palette.length], stroke: "#ffffff", "stroke-width": 2,
          class: "slice", "data-pub": item.pub
        });
        path.addEventListener("mouseenter", e => { setSelected(item); showTip(e, item); });
        path.addEventListener("mousemove", e => moveTip(e));
        path.addEventListener("mouseleave", hideTip);
        path.addEventListener("click", () => setSelected(item));

        if (item.share >= 0.03) {
          const mid = start + sliceAngle/2;
          const lp = polar(cx, cy, outerR+24, mid);
          create("text", {
            x: lp.x, y: lp.y, "text-anchor": lp.x >= cx ? "start" : "end",
            fill: "#17212b", "font-size": 13, "font-weight": 700
          }).textContent = `${item.pub.replace(/^\d+-?/,"")} ${pctN(item.share)}`;
        }
        angle = end;
      });

      create("circle", { cx, cy, r: innerR-4, fill: "#ffffff" });
      create("text", { x: cx, y: cy-18, "text-anchor": "middle", fill: "#617080", "font-size": 16 }).textContent = "Total Revenue";
      create("text", { x: cx, y: cy+10, "text-anchor": "middle", fill: "#17212b", "font-size": 28, "font-weight": 800 }).textContent = short(totals.revenue);
      create("text", { x: cx, y: cy+38, "text-anchor": "middle", fill: "#d14c32", "font-size": 16, "font-weight": 700 }).textContent = `毛利 ${short(totals.profit)}`;
    }

    setTotals();
    setSelected(null);
    renderRows();
    renderPie();
    window.addEventListener("resize", renderPie);
  </script>
</body>
</html>
